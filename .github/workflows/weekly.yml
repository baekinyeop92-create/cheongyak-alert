name: weekly-update

# 매주 월요일 06:00 KST: 수집 → 검증 → 데이터 커밋 → 사이트 배포 → 신규 공고 이슈 알림 → 전달 표시.
# 12:00 KST 는 재시도 슬롯 — 06시 실행이 수집·배포·알림까지 정상 완료됐으면 건너뛴다.
# 주소는 https://<계정>.github.io/<저장소>/ 로 고정 — 이 워크플로는 Pages 설정·도메인을 바꾸지 않는다.
on:
  schedule:
    - cron: "0 21 * * 0"   # 월 06:00 KST (= 일 21:00 UTC)
    - cron: "0 3 * * 1"    # 월 12:00 KST 재시도 슬롯
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      run: ${{ steps.gate.outputs.run }}
      status: ${{ steps.validate.outputs.status }}
      digest_count: ${{ steps.notify.outputs.digest_count }}
    env:
      TZ: Asia/Seoul
      APPLYHOME_API_KEY: ${{ secrets.APPLYHOME_API_KEY }}
      LH_API_KEY: ${{ secrets.LH_API_KEY }}
      LH_ENABLED: ${{ vars.LH_ENABLED || 'true' }}
      SITE_URL: ${{ vars.SITE_URL }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      # 트리거 시점 커밋이 아니라 브랜치 최신본 — 대기 중이던 실행이 직전 실행의 결과를 보고 시작하도록
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 실행 여부 판단 (재시도 슬롯)
        id: gate
        run: node scripts/should-run.mjs
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}

      - name: 자체 테스트 (오프라인 스텁 API)
        if: steps.gate.outputs.run == 'true'
        run: npm test

      - name: 수집 (청약홈 4종 + LH)
        if: steps.gate.outputs.run == 'true'
        run: node scripts/fetch.mjs

      - name: 무결성 검사 → 통과 시 승격
        id: validate
        if: steps.gate.outputs.run == 'true'
        run: node scripts/validate.mjs

      # 저장이 먼저, 배포는 그다음. push 가 실패하면 여기서 멈춘다 — 저장 안 된 데이터를 배포하지 않는다.
      - name: 데이터 커밋·push
        id: commit
        if: steps.validate.outputs.status == 'ok' || steps.validate.outputs.status == 'degraded'
        run: |
          node scripts/record-run.mjs "${{ steps.validate.outputs.status }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/store.json data/meta.json data/runs.json
          git commit -m "data: 주간 갱신 $(date +%F) [${{ steps.validate.outputs.status }}]" || echo "변경 없음"
          bash scripts/push.sh

      - name: 사이트 빌드 + 주간 요약
        id: notify
        if: steps.commit.outcome == 'success'
        run: |
          node scripts/build.mjs
          node scripts/notify.mjs
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

      - name: Pages 산출물 업로드
        if: steps.commit.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 요약 보관
        if: steps.commit.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: digest
          path: _out/
          retention-days: 30

      # 차단·오류로 끝난 주에도 실행 기록을 남긴다 → 저장소 활동이 이어져
      # '공개 저장소 60일 무활동 시 예약 실행 자동 중지'에 걸리지 않는다. 데이터(store)는 건드리지 않는다.
      - name: 실패 기록 커밋
        if: failure() && steps.gate.outputs.run == 'true' && steps.commit.outcome != 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${GITHUB_REF_NAME}" && git reset --hard "origin/${GITHUB_REF_NAME}"
          node scripts/record-run.mjs failed
          git add data/runs.json
          git commit -m "data: 주간 갱신 실패 기록 $(date +%F)" && bash scripts/push.sh || echo "실패 기록 push 도 실패"

  deploy:
    needs: update
    if: needs.update.result == 'success' && (needs.update.outputs.status == 'ok' || needs.update.outputs.status == 'degraded')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: [update, deploy]
    if: always() && needs.update.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        if: needs.deploy.result == 'success'
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        if: needs.deploy.result == 'success'
        with:
          node-version: 22

      - name: 요약 받기
        if: needs.deploy.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: digest
          path: _out

      - name: 신규 공고 이슈 (저장소 주인 @멘션 → 메일)
        if: needs.deploy.result == 'success' && needs.update.outputs.digest_count != '0'
        run: |
          gh label create digest --color 1f4fd6 --description "주간 신규 공고" --force >/dev/null 2>&1 || true
          # 5일 넘은 요약 이슈만 닫는다(같은 주 재시도로 이번 주 요약이 사라지지 않게)
          cutoff=$(date -u -d '5 days ago' +%Y-%m-%dT%H:%M:%SZ)
          for n in $(gh issue list --label digest --state open --limit 100 --json number,createdAt -q ".[] | select(.createdAt < \"$cutoff\") | .number"); do
            gh issue close "$n" --reason completed >/dev/null || true
          done
          gh issue create --title "$(cat _out/digest-title.txt)" --body-file _out/digest.md --label digest

      # 배포·이슈까지 끝났을 때만 '전달 완료' — 이게 없으면 다음 실행이 이번 신규를 다시 알리고, 12시 슬롯도 다시 돈다
      - name: 전달 완료 표시
        if: needs.deploy.result == 'success'
        run: |
          node scripts/mark-delivered.mjs "$(cat _out/run-at.txt)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/delivery.json
          git commit -m "data: 알림 전달 $(TZ=Asia/Seoul date +%F)" || echo "변경 없음"
          bash scripts/push.sh

      - name: 실패·차단 알림
        if: needs.update.result != 'success' || needs.deploy.result != 'success' || failure()
        run: |
          gh label create alert --color c0352b --description "수집 실패·경고" --force >/dev/null 2>&1 || true
          gh issue create --label alert \
            --title "⚠ 청약 알림 주간 갱신 실패 $(TZ=Asia/Seoul date +%F)" \
            --body "@${{ github.repository_owner }} 이번 주 갱신이 끝까지 가지 못했습니다(update: ${{ needs.update.result }} · deploy: ${{ needs.deploy.result }}). **저장된 데이터와 사이트는 직전 상태로 유지됩니다.** 알리지 못한 신규 공고는 다음 실행 요약에 넘어가고, 빠진 기간은 다음 수집이 다시 훑습니다.

          - 실행 로그: ${RUN_URL}
          - 자주 있는 원인: 인증키 만료·미등록(Secrets 의 APPLYHOME_API_KEY), 공공데이터포털 점검, API 필드명 변경, Pages 설정(Source=GitHub Actions)
          - 조치 후 Actions → weekly-update → Run workflow 로 바로 다시 돌릴 수 있습니다."
          exit 1

      - name: 부분 실패 알림
        if: needs.update.outputs.status == 'degraded' && needs.deploy.result == 'success'
        run: |
          gh label create alert --color c0352b --description "수집 실패·경고" --force >/dev/null 2>&1 || true
          gh issue create --label alert \
            --title "⚠ 청약 알림 일부 소스 실패 $(TZ=Asia/Seoul date +%F)" \
            --body "@${{ github.repository_owner }} 사이트는 갱신됐지만 일부 소스·주택형 조회가 실패했습니다. 사이트 상단 경고와 하단 '수집 점검'에 내역이 있습니다. 12:00 재시도 슬롯이 한 번 더 수집합니다.

          - 실행 로그: ${RUN_URL}"
          exit 1
