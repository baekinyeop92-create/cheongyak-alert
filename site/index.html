<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>청약 알림 · 서울·경기 13억 이하</title>
<meta name="description" content="청약홈·LH 공고 중 서울·경기에서 분양가 13억 이하 주택형이 있는 공고만 매주 모아 보여줍니다.">
<meta name="theme-color" content="#f5f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0f11" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="청약 알림">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="alternate" type="application/rss+xml" title="청약 알림 — 서울·경기 13억 이하" href="feed.xml">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f2; --surface: #ffffff; --surface-2: #fafaf7;
    --ink: #14161a; --ink-2: #3b3f46; --muted: #6b6f78; --faint: #9a9ea6;
    --line: #e4e4de; --line-2: #d3d3cc;
    --accent: #1f4fd6; --accent-ink: #ffffff; --accent-soft: #e9eefc;
    --ok: #0d7a4c; --ok-soft: #e4f3ea;
    --warn: #a4580a; --warn-soft: #fbf0e0;
    --danger: #c0352b; --danger-soft: #fbe8e5;
    --idle: #80848c; --idle-soft: #efefeb;
    --shadow: 0 1px 2px rgb(20 22 26 / .05), 0 2px 8px -4px rgb(20 22 26 / .06);
    --r: 14px; --r-sm: 9px;
    --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0f11; --surface: #16181b; --surface-2: #1b1d21;
      --ink: #ececea; --ink-2: #c8cace; --muted: #9a9ea7; --faint: #6f737b;
      --line: #26292e; --line-2: #33363c;
      --accent: #86a8ff; --accent-ink: #0e0f11; --accent-soft: #1b2442;
      --ok: #52c28e; --ok-soft: #11281d;
      --warn: #efa64d; --warn-soft: #2c2012;
      --danger: #ff7d72; --danger-soft: #331715;
      --idle: #8a8e96; --idle-soft: #202226;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 var(--font); letter-spacing: -0.005em;
    -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: anywhere;
  }
  a { color: inherit; }
  button, select, input { font: inherit; color: inherit; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 22px 16px 80px; padding-top: max(22px, env(safe-area-inset-top)); }

  /* 헤더 */
  .top { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; margin-bottom: 14px; }
  h1 { font-size: 1.55rem; line-height: 1.2; font-weight: 750; letter-spacing: -0.03em; margin: 0 0 4px; }
  .sub { margin: 0; color: var(--muted); font-size: .86rem; }
  .sub b { color: var(--ink); font-weight: 650; }
  .health {
    display: inline-flex; align-items: center; gap: 7px; text-decoration: none; white-space: nowrap;
    font-size: .8rem; font-weight: 600; padding: 7px 12px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); flex: none; }
  .h-ok .dot { background: var(--ok); } .h-warn .dot { background: var(--warn); } .h-bad .dot { background: var(--danger); }
  .h-bad { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); }
  .h-warn { color: var(--warn); }

  .banner { border-radius: var(--r-sm); padding: 11px 14px; margin: 0 0 12px; font-size: .86rem; border: 1px solid; }
  .banner b { font-weight: 700; }
  .banner ul { margin: 6px 0 0; padding-left: 18px; }
  .b-warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
  .b-bad { background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 35%, transparent); }

  /* 상태 칩 */
  .stats { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 12px; scrollbar-width: none; }
  .stats::-webkit-scrollbar { display: none; }
  .stat {
    flex: none; cursor: pointer; display: flex; align-items: baseline; gap: 6px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 8px 13px;
    box-shadow: var(--shadow); transition: border-color .12s, background .12s;
  }
  .stat b { font-size: 1.12rem; font-weight: 750; font-variant-numeric: tabular-nums; }
  .stat span { font-size: .78rem; color: var(--muted); }
  .stat:hover:not(:disabled) { border-color: var(--line-2); }
  .stat:disabled { opacity: .45; cursor: default; }
  .stat.on { border-color: var(--ink); background: var(--surface-2); }
  .stat.closing b { color: var(--danger); } .stat.open b { color: var(--ok); } .stat.upcoming b { color: var(--warn); } .stat.new b { color: var(--accent); }

  /* 필터 */
  .controls {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
    padding: 12px; margin-bottom: 16px; box-shadow: var(--shadow); display: grid; gap: 10px;
  }
  @media (min-width: 720px) { .controls { position: sticky; top: 8px; z-index: 5; } }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .seg { display: inline-flex; background: var(--idle-soft); border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: .86rem; font-weight: 600; color: var(--muted); }
  .seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
  select, input[type=search] {
    height: 36px; border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; font-size: .86rem;
    background: Canvas; color: CanvasText;
  }
  select option, select optgroup { background: Canvas; color: CanvasText; }
  input[type=search] { flex: 1 1 180px; min-width: 0; }
  .lbl { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--muted); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 11px;
    font-size: .8rem; font-weight: 600; color: var(--muted); cursor: pointer;
  }
  .chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .check { display: inline-flex; align-items: center; gap: 6px; font-size: .84rem; color: var(--ink-2); cursor: pointer; }
  .check input { width: 16px; height: 16px; accent-color: var(--ink); }
  .grow { flex: 1; }
  .count { font-size: .8rem; color: var(--muted); white-space: nowrap; }

  /* 목록 */
  .sec-h { display: flex; align-items: baseline; gap: 8px; margin: 22px 2px 10px; }
  .sec-h h2 { font-size: 1rem; margin: 0; font-weight: 700; letter-spacing: -0.02em; }
  .sec-h span { color: var(--muted); font-size: .82rem; }
  .list { display: grid; gap: 12px; }

  .card {
    position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
    padding: 16px 16px 14px; box-shadow: var(--shadow);
  }
  .card.is-closed { opacity: .72; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .badge { font-size: .72rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: var(--idle-soft); color: var(--ink-2); white-space: nowrap; }
  .st-open { background: var(--ok-soft); color: var(--ok); }
  .st-closing { background: var(--danger-soft); color: var(--danger); }
  .st-upcoming { background: var(--warn-soft); color: var(--warn); }
  .st-closed, .st-tbd { background: var(--idle-soft); color: var(--idle); }
  .badge.new { background: var(--accent); color: var(--accent-ink); }
  .badge.gone { background: var(--danger-soft); color: var(--danger); }
  .name { font-size: 1.06rem; line-height: 1.35; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 3px; }
  .where { margin: 0 0 12px; color: var(--muted); font-size: .82rem; }

  .key { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 11px; overflow: hidden; margin-bottom: 11px; }
  .key > div { background: var(--surface-2); padding: 9px 11px; min-width: 0; }
  .key span { display: block; font-size: .7rem; color: var(--muted); margin-bottom: 2px; }
  .key strong { display: block; font-size: .98rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .key .price strong { color: var(--ok); font-size: 1.04rem; }
  @media (max-width: 520px) {
    .key { grid-template-columns: 1fr 1fr; }
    .key .price { grid-column: 1 / -1; }
  }

  .sched { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0 0 12px; padding: 0; list-style: none; font-size: .8rem; color: var(--ink-2); }
  .sched li span { color: var(--muted); margin-right: 5px; }
  .sched li.past { color: var(--faint); text-decoration: line-through; text-decoration-color: var(--line-2); }

  .actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .btn {
    display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 9px;
    border: 1px solid var(--line); text-decoration: none; font-size: .8rem; font-weight: 650; background: transparent; cursor: pointer;
  }
  .btn:hover { border-color: var(--line-2); background: var(--surface-2); }
  .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn.primary:hover { opacity: .9; background: var(--ink); }

  details.types { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; }
  details.types summary { cursor: pointer; font-size: .8rem; color: var(--muted); font-weight: 600; list-style: none; }
  details.types summary::-webkit-details-marker { display: none; }
  details.types summary::before { content: '▸ '; }
  details.types[open] summary::before { content: '▾ '; }
  .tbl-wrap { overflow-x: auto; margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: .8rem; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: .74rem; }
  td.num, th.num { text-align: right; }
  .v-pass { color: var(--ok); font-weight: 700; } .v-border { color: var(--warn); font-weight: 700; }
  .v-over, .v-area { color: var(--faint); } .v-unknown { color: var(--warn); }

  /* 보조 칸 */
  details.more { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); margin-top: 12px; box-shadow: var(--shadow); }
  details.more > summary { cursor: pointer; padding: 13px 16px; font-weight: 650; font-size: .92rem; list-style: none; display: flex; gap: 8px; align-items: baseline; }
  details.more > summary::-webkit-details-marker { display: none; }
  details.more > summary::after { content: '펼치기'; margin-left: auto; font-size: .76rem; color: var(--muted); font-weight: 500; }
  details.more[open] > summary::after { content: '접기'; }
  details.more > summary small { color: var(--muted); font-weight: 500; font-size: .78rem; }
  .rows { border-top: 1px solid var(--line); }
  .r { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: .84rem; }
  .r:last-child { border-bottom: 0; }
  .r .t { font-weight: 650; min-width: 0; }
  .r .t a { text-decoration: none; } .r .t a:hover { text-decoration: underline; }
  .r .m { color: var(--muted); font-size: .76rem; grid-column: 1; }
  .r .p { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .r .s { text-align: right; font-size: .74rem; color: var(--muted); white-space: nowrap; }
  .note { padding: 10px 16px 12px; font-size: .78rem; color: var(--muted); border-top: 1px solid var(--line); }

  .empty { background: var(--surface); border: 1px dashed var(--line-2); border-radius: var(--r); padding: 28px 18px; text-align: center; color: var(--muted); }
  .empty b { color: var(--ink); display: block; margin-bottom: 4px; font-size: 1rem; }
  .empty p { margin: 4px 0 0; font-size: .86rem; }

  /* 점검표 */
  footer { margin-top: 36px; font-size: .82rem; color: var(--ink-2); }
  footer h2 { font-size: .95rem; margin: 0 0 10px; letter-spacing: -0.02em; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; margin-bottom: 12px; }
  .eq { font-variant-numeric: tabular-nums; font-size: .86rem; margin: 0 0 12px; }
  .eq b { font-weight: 700; }
  .ok-mark { color: var(--ok); font-weight: 700; } .bad-mark { color: var(--danger); font-weight: 700; }
  .s-ok { color: var(--ok); } .s-warn { color: var(--warn); } .s-bad { color: var(--danger); } .s-idle { color: var(--idle); }
  .runs { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
  .run { font-size: .72rem; padding: 3px 7px; border-radius: 6px; background: var(--idle-soft); color: var(--ink-2); text-decoration: none; }
  .run.ok { background: var(--ok-soft); color: var(--ok); } .run.degraded { background: var(--warn-soft); color: var(--warn); } .run.failed { background: var(--danger-soft); color: var(--danger); }
  .fine { color: var(--muted); font-size: .78rem; line-height: 1.6; }
  .fine p { margin: 0 0 6px; }
  .links { display: flex; gap: 6px 14px; flex-wrap: wrap; margin-top: 8px; }
  .links a { color: var(--accent); text-decoration: none; font-weight: 600; font-size: .8rem; }
  .links a:hover { text-decoration: underline; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>청약 알림</h1>
      <p class="sub">서울·경기 · 주택형 최고 분양가 <b id="capText">13억</b> 이하 · 매주 월요일 오전 갱신</p>
    </div>
    <a class="health" id="health" href="#audit"><span class="dot"></span><span>불러오는 중</span></a>
  </header>

  <div id="banners"></div>
  <nav class="stats" id="stats" aria-label="상태별 보기"></nav>

  <section class="controls" aria-label="필터">
    <div class="row">
      <div class="seg" id="region" role="group" aria-label="지역">
        <button type="button" data-v="">전체</button><button type="button" data-v="서울">서울</button><button type="button" data-v="경기">경기</button>
      </div>
      <select id="sigungu" aria-label="시·군·구"><option value="">시·군·구 전체</option></select>
      <input id="q" type="search" placeholder="단지명·주소 검색" aria-label="검색" autocomplete="off">
    </div>
    <div class="row">
      <div class="chips" id="kinds" role="group" aria-label="공고 유형"></div>
    </div>
    <div class="row">
      <label class="lbl">상한 <select id="cap" aria-label="분양가 상한"></select></label>
      <label class="lbl">전용 <select id="area" aria-label="전용면적 하한">
        <option value="0">전체</option><option value="40">40㎡ 이상</option><option value="59">59㎡ 이상</option><option value="84">84㎡ 이상</option>
      </select></label>
      <label class="lbl">정렬 <select id="sort" aria-label="정렬">
        <option value="urgent">마감 임박순</option><option value="new">최근 공고순</option><option value="price">낮은 가격순</option>
      </select></label>
      <label class="check"><input type="checkbox" id="closed"> 마감 포함</label>
      <span class="grow"></span>
      <span class="count" id="count" aria-live="polite"></span>
    </div>
  </section>

  <main id="main"><div class="empty"><b>불러오는 중…</b></div></main>
  <section id="extra" aria-label="판정 보류·초과 공고"></section>
  <footer id="audit"></footer>
</div>
<noscript><p style="text-align:center">이 페이지는 JavaScript 가 필요합니다.</p></noscript>
<script type="module" src="app.js?v=__BUILD__"></script>
</body>
</html>
