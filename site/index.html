<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>청약 알림 · 서울·경기 13억 이하</title>
<meta name="description" content="청약홈·LH 공고 중 서울·경기에서 분양가 13억 이하 주택형이 있는 공고만 매주 모아 보여줍니다.">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d10" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="청약 알림">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="alternate" type="application/rss+xml" title="청약 알림 — 서울·경기 13억 이하" href="feed.xml">
<style>
  /* 디자인 토큰 — design-tokens.css(--cq-*)를 기존 변수 체계에 매핑. 다크 모드도 같은 체계. */
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7; --surface: #ffffff; --surface-2: #f6f6f8;
    --ink: #1d1d1f; --ink-2: #3a3a3e; --muted: #626268; --faint: #86868b;
    --line: #d8d8de; --line-2: #c9c9d0; --control-line: #85858c;
    --accent: #0066cc; --accent-hover: #0055aa; --accent-ink: #ffffff; --accent-soft: #eaf3ff;
    --ok: #176b3a; --ok-soft: #edf7ef;
    --warn: #875500; --warn-soft: #fff5df;
    --danger: #b42318; --danger-soft: #fff0ee;
    --idle: #6e6e73; --idle-soft: #f0f0f3;
    --shadow: 0 2px 12px rgb(0 0 0 / 4%);
    --focus: 0 0 0 3px rgb(0 102 204 / 35%);
    --dur: 180ms; --ease: cubic-bezier(.2, .8, .2, 1);
    --r: 20px; --r-sm: 12px; --r-badge: 6px;
    --font: -apple-system, BlinkMacSystemFont, "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Segoe UI", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0d10; --surface: #1c1c1e; --surface-2: #26262a;
      --ink: #f5f5f7; --ink-2: #d6d6da; --muted: #a1a1a6; --faint: #6e6e73;
      --line: #3a3a3f; --line-2: #47474d; --control-line: #6e6e73;
      --accent: #409cff; --accent-hover: #66b0ff; --accent-ink: #0d0d10; --accent-soft: #16304d;
      --ok: #4cc38a; --ok-soft: #12301f;
      --warn: #e0a33e; --warn-soft: #33270f;
      --danger: #ff7369; --danger-soft: #3b1d19;
      --idle: #98989f; --idle-soft: #2a2a2e;
      --focus: 0 0 0 3px rgb(64 156 255 / 45%);
      --shadow: none;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    :root { --dur: 0ms; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 var(--font); letter-spacing: 0;
    -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: anywhere;
  }
  a { color: inherit; }
  button, select, input { font: inherit; color: inherit; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 24px 20px 96px; padding-top: max(24px, env(safe-area-inset-top)); }
  @media (min-width: 640px) { .wrap { padding-left: 24px; padding-right: 24px; } }
  @media (min-width: 1024px) { .wrap { padding: 32px 32px 96px; } }
  a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible {
    outline: none; box-shadow: var(--focus);
  }
  .btn, .chip, .stat, .seg button, select, input[type=search], .run, .links a, summary {
    transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease),
      color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  }

  /* 헤더 */
  .top { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 28px; line-height: 36px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 4px; }
  @media (min-width: 1024px) { h1 { font-size: 36px; line-height: 44px; } }
  .sub { margin: 0; color: var(--muted); font-size: 14px; line-height: 20px; }
  .sub b { color: var(--ink); font-weight: 600; }
  .health {
    display: inline-flex; align-items: center; gap: 8px; text-decoration: none; white-space: nowrap;
    font-size: 14px; font-weight: 600; min-height: 44px; padding: 8px 16px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); flex: none; }
  .h-ok .dot { background: var(--ok); } .h-warn .dot { background: var(--warn); } .h-bad .dot { background: var(--danger); }
  .h-bad { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); }
  .h-warn { color: var(--warn); }

  .banner { border-radius: var(--r-sm); padding: 12px 16px; margin: 0 0 16px; font-size: 14px; line-height: 20px; border: 1px solid; }
  .banner b { font-weight: 700; }
  .banner ul { margin: 6px 0 0; padding-left: 18px; }
  .b-warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
  .b-bad { background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 35%, transparent); }

  /* 상태 칩 */
  .stats { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 16px; scrollbar-width: none; }
  .stats::-webkit-scrollbar { display: none; }
  .stat {
    flex: none; cursor: pointer; display: flex; align-items: baseline; gap: 6px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm);
    min-height: 44px; padding: 10px 16px; box-shadow: var(--shadow);
  }
  .stat b { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 13px; color: var(--muted); }
  .stat:hover:not(:disabled) { border-color: var(--line-2); background: var(--surface-2); }
  .stat:disabled { opacity: .45; cursor: default; }
  .stat.on { border-color: var(--accent); background: var(--accent-soft); }
  .stat.on span { color: var(--ink-2); }
  .stat.closing b { color: var(--danger); } .stat.open b { color: var(--ok); } .stat.upcoming b { color: var(--warn); } .stat.new b { color: var(--accent); }

  /* 필터 */
  .controls {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
    padding: 16px; margin-bottom: 24px; box-shadow: var(--shadow); display: grid; gap: 12px;
  }
  @media (min-width: 720px) { .controls { position: sticky; top: 8px; z-index: 5; } }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .seg { display: inline-flex; background: var(--idle-soft); border-radius: var(--r-sm); padding: 4px; }
  .seg button { border: 0; background: transparent; min-height: 36px; padding: 6px 16px; border-radius: 9px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--muted); }
  .seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / 10%); }
  select, input[type=search] {
    height: 48px; border: 1px solid var(--control-line); border-radius: var(--r-sm); padding: 0 12px; font-size: 15px;
    background: Canvas; color: CanvasText;
  }
  select option, select optgroup { background: Canvas; color: CanvasText; }
  input[type=search] { flex: 1 1 200px; min-width: 0; }
  .lbl { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; min-height: 44px; padding: 10px 16px;
    font-size: 14px; font-weight: 600; color: var(--ink-2); cursor: pointer;
  }
  .chip:hover { background: var(--surface-2); }
  .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .check { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-size: 14px; color: var(--ink-2); cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); }
  .grow { flex: 1; }
  .count { font-size: 14px; color: var(--muted); white-space: nowrap; }

  /* 목록 — 하나의 흰색 패널 안에 구분선으로 나눈 행 */
  .sec-h { display: flex; align-items: baseline; gap: 10px; margin: 32px 2px 12px; }
  .sec-h h2 { font-size: 20px; line-height: 28px; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  .sec-h span { color: var(--muted); font-size: 14px; }
  .list {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
    box-shadow: var(--shadow); overflow: hidden;
  }

  .card { position: relative; background: var(--surface); padding: 20px; border-top: 1px solid var(--line); }
  .card:first-child { border-top: 0; }
  @media (min-width: 640px) { .card { padding: 24px; } }
  .card.is-closed { opacity: .72; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .badge { font-size: 12px; line-height: 18px; font-weight: 600; padding: 3px 8px; border-radius: var(--r-badge); background: var(--idle-soft); color: var(--ink-2); white-space: nowrap; }
  .st-open { background: var(--ok-soft); color: var(--ok); }
  .st-closing { background: var(--danger-soft); color: var(--danger); }
  .st-upcoming { background: var(--warn-soft); color: var(--warn); }
  .st-closed, .st-tbd { background: var(--idle-soft); color: var(--idle); }
  .badge.new { background: var(--accent); color: var(--accent-ink); }
  .badge.gone { background: var(--danger-soft); color: var(--danger); }
  .name { font-size: 17px; line-height: 25px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 4px; }
  .where { margin: 0 0 12px; color: var(--muted); font-size: 14px; line-height: 20px; }

  .key { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; margin-bottom: 12px; }
  .key > div { background: var(--surface-2); padding: 10px 12px; min-width: 0; }
  .key span { display: block; font-size: 12px; line-height: 18px; color: var(--muted); margin-bottom: 2px; }
  .key strong { display: block; font-size: 16px; line-height: 24px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: 0; }
  .key .price strong { color: var(--ok); font-size: 17px; font-weight: 700; }
  .key .cash strong { color: var(--accent); }
  @media (max-width: 520px) {
    .key { grid-template-columns: 1fr 1fr; }
    .key .price, .key .cash { grid-column: 1 / -1; }
  }

  .qual { margin: -4px 0 14px; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font-size: 12px; line-height: 18px; }
  .qual .q-t { color: var(--muted); margin-right: 2px; }
  .q-c { background: var(--idle-soft); border-radius: var(--r-badge); padding: 3px 8px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
  .q-none { background: var(--warn-soft); color: var(--warn); }
  .q-note { color: var(--faint); }
  .u-split { color: var(--muted); font-size: 12px; }

  .mkline { margin: -2px 0 12px; font-size: 14px; line-height: 20px; color: var(--muted); }
  .mkline b { font-weight: 700; }
  .mkline span { font-size: 12px; }
  .mk-cheap { color: var(--ok); } .mk-exp { color: var(--danger); }

  .sched { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0 0 14px; padding: 0; list-style: none; font-size: 14px; line-height: 20px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .sched li span { color: var(--muted); margin-right: 6px; }
  .sched li.past { color: var(--faint); text-decoration: line-through; text-decoration-color: var(--line-2); }

  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 16px; border-radius: var(--r-sm);
    border: 1px solid var(--line-2); text-decoration: none; font-size: 15px; font-weight: 600; background: var(--surface); color: var(--ink); cursor: pointer;
  }
  .btn:hover { border-color: var(--control-line); background: var(--surface-2); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

  details.types { margin-top: 14px; border-top: 1px solid var(--line); }
  details.types summary { cursor: pointer; font-size: 14px; color: var(--muted); font-weight: 600; list-style: none; min-height: 44px; display: flex; align-items: center; }
  details.types summary:hover { color: var(--ink-2); }
  details.types summary::-webkit-details-marker { display: none; }
  details.types summary::before { content: '▸ '; }
  details.types[open] summary::before { content: '▾ '; }
  .tbl-wrap { overflow-x: auto; margin: 0 0 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  tbody tr:last-child td { border-bottom: 0; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  td.num, th.num { text-align: right; }
  .v-pass { color: var(--ok); font-weight: 700; } .v-border { color: var(--warn); font-weight: 700; }
  .v-over, .v-area { color: var(--faint); } .v-unknown { color: var(--warn); }

  /* 보조 칸 */
  details.more { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); margin-top: 16px; box-shadow: var(--shadow); overflow: hidden; }
  details.more > summary { cursor: pointer; min-height: 44px; padding: 14px 20px; font-weight: 600; font-size: 16px; list-style: none; display: flex; gap: 8px; align-items: baseline; }
  details.more > summary::-webkit-details-marker { display: none; }
  details.more > summary::after { content: '펼치기'; margin-left: auto; font-size: 13px; color: var(--accent); font-weight: 600; }
  details.more[open] > summary::after { content: '접기'; }
  details.more > summary small { color: var(--muted); font-weight: 500; font-size: 13px; }
  .rows { border-top: 1px solid var(--line); }
  .r { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); font-size: 14px; line-height: 20px; }
  .r:last-child { border-bottom: 0; }
  .r .t { font-weight: 600; min-width: 0; }
  .r .t a { text-decoration: none; } .r .t a:hover { text-decoration: underline; }
  .r .m { color: var(--muted); font-size: 12px; grid-column: 1; }
  .r .p { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .r .s { text-align: right; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .note { padding: 12px 20px 14px; font-size: 13px; line-height: 19px; color: var(--muted); border-top: 1px solid var(--line); }

  .empty { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 40px 20px; text-align: center; color: var(--muted); }
  .empty b { color: var(--ink); display: block; margin-bottom: 4px; font-size: 17px; }
  .empty p { margin: 4px 0 0; font-size: 14px; line-height: 20px; }
  .empty .btn { margin-top: 16px; }

  /* 로딩 스켈레톤 — 실제 공고 행 구조를 흉내낸다 */
  .skel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
  .skel > div { padding: 20px; border-top: 1px solid var(--line); }
  .skel > div:first-child { border-top: 0; }
  .skel i { display: block; border-radius: var(--r-badge); background: var(--surface-2); height: 14px; }
  .skel .a { width: 30%; height: 20px; margin-bottom: 10px; }
  .skel .b { width: 62%; margin-bottom: 8px; }
  .skel .c { width: 44%; }

  /* 점검표 */
  footer { margin-top: 48px; font-size: 14px; line-height: 20px; color: var(--ink-2); }
  footer h2 { font-size: 20px; line-height: 28px; font-weight: 600; margin: 0 0 12px; letter-spacing: -0.01em; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .eq { font-variant-numeric: tabular-nums; font-size: 15px; margin: 0 0 12px; }
  .eq b { font-weight: 700; }
  .ok-mark { color: var(--ok); font-weight: 700; } .bad-mark { color: var(--danger); font-weight: 700; }
  .s-ok { color: var(--ok); } .s-warn { color: var(--warn); } .s-bad { color: var(--danger); } .s-idle { color: var(--idle); }
  .runs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .run { font-size: 12px; line-height: 18px; font-weight: 600; padding: 3px 8px; border-radius: var(--r-badge); background: var(--idle-soft); color: var(--ink-2); text-decoration: none; }
  .run.ok { background: var(--ok-soft); color: var(--ok); } .run.degraded { background: var(--warn-soft); color: var(--warn); } .run.failed { background: var(--danger-soft); color: var(--danger); }
  .fine { color: var(--muted); font-size: 13px; line-height: 20px; }
  .fine p { margin: 0 0 8px; }
  .links { display: flex; gap: 8px 16px; flex-wrap: wrap; margin-top: 10px; }
  .links a { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 14px; min-height: 44px; display: inline-flex; align-items: center; }
  .links a:hover { color: var(--accent-hover); text-decoration: underline; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>청약 알림</h1>
      <p class="sub">서울·경기 · 주택형 최고 분양가 <b id="capText">13억</b> 이하 · 매주 월요일 오전 갱신</p>
    </div>
    <a class="health" id="health" href="#audit"><span class="dot"></span><span>불러오는 중</span></a>
  </header>

  <div id="banners"></div>
  <nav class="stats" id="stats" aria-label="상태별 보기"></nav>

  <section class="controls" aria-label="필터">
    <div class="row">
      <div class="seg" id="region" role="group" aria-label="지역">
        <button type="button" data-v="">전체</button><button type="button" data-v="서울">서울</button><button type="button" data-v="경기">경기</button>
      </div>
      <select id="sigungu" aria-label="시·군·구"><option value="">시·군·구 전체</option></select>
      <input id="q" type="search" placeholder="단지명·주소 검색" aria-label="검색" autocomplete="off">
    </div>
    <div class="row">
      <div class="chips" id="kinds" role="group" aria-label="공고 유형"></div>
    </div>
    <div class="row">
      <label class="lbl">상한 <select id="cap" aria-label="분양가 상한"></select></label>
      <label class="lbl">전용 <select id="area" aria-label="전용면적 하한">
        <option value="0">전체</option><option value="40">40㎡ 이상</option><option value="59">59㎡ 이상</option><option value="84">84㎡ 이상</option>
      </select></label>
      <label class="lbl">정렬 <select id="sort" aria-label="정렬">
        <option value="urgent">마감 임박순</option><option value="new">최근 공고순</option><option value="price">낮은 가격순</option>
      </select></label>
      <label class="lbl">계약금 <select id="down" aria-label="계약금 비율 가정">
        <option value="10">10% 가정</option><option value="15">15% 가정</option><option value="20">20% 가정</option>
      </select></label>
      <label class="check"><input type="checkbox" id="closed"> 마감 포함</label>
      <span class="grow"></span>
      <span class="count" id="count" aria-live="polite"></span>
    </div>
  </section>

  <main id="main" aria-busy="true"><div class="skel" role="status" aria-label="공고를 불러오는 중">
    <div><i class="a"></i><i class="b"></i><i class="c"></i></div>
    <div><i class="a"></i><i class="b"></i><i class="c"></i></div>
    <div><i class="a"></i><i class="b"></i><i class="c"></i></div>
  </div></main>
  <section id="extra" aria-label="판정 보류·초과 공고"></section>
